<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
body { font-family: Arial, sans-serif; background:#f4f7fb; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
form { background:#fff; padding:30px; border-radius:10px; box-shadow:0 8px 25px rgba(0,0,0,0.1); width:300px; }
form h2 { text-align:center; margin-bottom:20px; color:#007BFF; }
form input { width:100%; padding:10px; margin-bottom:15px; border-radius:5px; border:1px solid #ccc; }
form button { width:100%; padding:10px; border:none; border-radius:5px; background:#007BFF; color:#fff; font-size:16px; cursor:pointer; }
form button:hover { background:#0056b3; }
</style>
</head>
<body>

<form action="login.php" method="POST">
    <h2>Login</h2>
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Login</button>
</form>

<script>
// Show alerts based on query parameters
const params = new URLSearchParams(window.location.search);
if(params.get("error") === "wrongpassword"){
    alert("Wrong Password!");
}
if(params.get("error") === "nouser"){
    alert("User not found!");
}
</script>

</body>
</html>
